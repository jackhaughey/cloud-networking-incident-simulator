[Interface]
Address = 10.0.2.1/24
PrivateKey = <SERVER_PRIVATE_KEY>
ListenPort = 51820

# Optional: simulate MTU issues
# MTU = 1280

# Optional: simulate log flooding
# PostUp = echo "Tunnel up" >> /var/log/wg.log
# PostDown = echo "Tunnel down" >> /var/log/wg.log

[Peer]
# Example remote peer (your "client")
PublicKey = <CLIENT_PUBLIC_KEY>
AllowedIPs = 10.0.2.2/32
PersistentKeepalive = 15
